const tl = gsap.timeline({ paused: true });
const ids = (p, names) => names.map((n) => "#" + p + "-" + n);
function blink(p, t, d = 0.18) {
  const e = ids(p, ["eyeL", "eyeR"]);
  tl.to(e, { scaleY: 0.08, duration: d * 0.4, ease: "power2.in", transformOrigin: "50% 50%" }, t);
