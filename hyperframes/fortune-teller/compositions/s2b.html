    (function () {
    
const tl = gsap.timeline({ paused: true });

function blink(p, t, d = 0.18) {
  const e = ids(p, ["eyeL", "eyeR"]);

function brows(p, y, rot, t, d = 0.4, ease = "power2.inOut") {

function turn(p, dx, t, d = 0.5, ease = "power2.inOut") {

}
